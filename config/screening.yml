# 자동 선정 설정 — 점수는 100점 만점
mailto: "your-email@university.ac.kr"   # OpenAlex 요청에 포함. 꼭 본인 이메일로 변경
lookback_days: 14        # 정기 실행 시 최근 며칠 이내 발행 논문을 조회할지
max_pages: 2             # 검색어당 최대 페이지 수 (페이지당 50건, 최신순)
min_year: 2015           # 이보다 오래된 논문은 하드 규칙으로 자동 반려
allowed_types: [article, review, preprint]

jcr:
  files: "config/jcr*.csv"   # Clarivate JCR에서 내려받은 CSV (여러 개 가능)
  if_cap: 10                 # IF가 이 값 이상이면 IF 점수 만점

weights:                      # 합계 100
  keyword_title: 20           # 제목에 키워드
  keyword_abstract: 10        # 초록에 키워드
  keyword_hits_bonus_each: 5  # 서로 다른 키워드가 하나 더 걸릴 때마다
  keyword_hits_bonus_max: 10
  jcr_impact_factor: 20       # IF / if_cap 비율만큼
  jcr_quartile: {Q1: 10, Q2: 7, Q3: 3, Q4: 0}
  jcr_category: 10            # 저널의 JCR 카테고리가 분야의 jcr_categories와 일치
  topic_match: 10             # OpenAlex 분류(논문 단위) 일치
  journal_match: 5            # topics.yml의 주제 저널 목록과 일치
  recent_year: 5
penalties:
  exclude_keyword: -40
  wrong_type: -30

# 수집 1회(batch)마다: 점수 상위 auto_select건은 자동 선정, 그 아래 review건은 사람이 판별, 나머지는 반려
selection:
  auto_select: 5
  review: 15
  auto_min_score: 60     # 자동 선정은 이 점수 이상일 때만 (미달이면 검토 대상으로 내려감)
  review_min_score: 40   # 검토 대상도 이 점수 이상일 때만 (미달이면 반려)

site:
  show_jcr: false        # true면 사이트에 IF/분위 표시. JCR 데이터 공개는 라이선스 확인 후 켜세요
