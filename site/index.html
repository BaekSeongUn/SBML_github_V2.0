<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구실 논문 목록</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--muted:#6b6b66;--card:#fff;--line:#e4e4de;--accent:#2f6f4f;--chip:#eef3ee}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--fg:#ecece8;--muted:#9a9a93;--card:#1f201e;--line:#32332f;--accent:#7cc79b;--chip:#26302a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:1.5rem;margin:0 0 4px}
.meta{color:var(--muted);font-size:.85rem;margin-bottom:20px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.paper h2{font-size:1.02rem;margin:0 0 4px}
.paper a{color:inherit}
.sub{color:var(--muted);font-size:.85rem}
.badge{display:inline-block;background:var(--chip);color:var(--accent);border-radius:4px;padding:0 6px;font-size:.75rem;margin-left:6px}
details{margin-top:6px;font-size:.9rem}
summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>연구실 논문 목록</h1>
  <div class="meta" id="meta"></div>
  <input id="q" type="search" placeholder="제목, 저자, 저널 검색">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
let all = [], active = "전체";
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  const rows = all.filter(p => (active === "전체" || p.topic === active) &&
    (!q || [p.title, p.journal, (p.authors || []).join(" ")].join(" ").toLowerCase().includes(q)));
  $("list").replaceChildren(...(rows.length ? rows.map(card) : [el("p", {className: "sub", textContent: "표시할 논문이 없습니다."})]));
}
function card(p) {
  const link = p.doi || (p.oa_url || "#");
  const h = el("h2", {}, el("a", {href: link, target: "_blank", rel: "noopener", textContent: p.title}));
  if (p.oa) h.append(el("span", {className: "badge", textContent: "OA"}));
  const authors = (p.authors || []).slice(0, 6).join(", ") + ((p.authors || []).length > 6 ? " 외" : "");
  const box = el("div", {className: "paper"}, h,
    el("div", {className: "sub", textContent: `${authors} · ${p.journal || "-"} · ${p.year || ""}${p.jif != null ? ` · IF ${p.jif} ${p.quartile || ""}` : ""}`}));
  if (p.abstract) box.append(el("details", {}, el("summary", {textContent: "초록"}), el("p", {textContent: p.abstract})));
  return box;
}
fetch("papers.json").then(r => r.json()).then(d => {
  all = d.papers;
  $("meta").textContent = `${all.length}편 · 업데이트 ${d.updated}`;
  ["전체", ...d.topics].forEach(t => {
    const b = el("button", {className: "tab", textContent: t});
    b.setAttribute("aria-pressed", t === active);
    b.onclick = () => { active = t; [...$("tabs").children].forEach(c => c.setAttribute("aria-pressed", c === b)); render(); };
    $("tabs").append(b);
  });
  render();
}).catch(() => { $("list").textContent = "papers.json을 불러오지 못했습니다."; });
$("q").addEventListener("input", render);
</script>
</body>
</html>
